{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <p class="eyebrow">Wallet account</p>
  <h1>Connect your wallet</h1>
  <p id="walletStatus">Connect MetaMask to see your address and sale proceeds.</p>
</section>
<section class="panel" id="walletPanel" hidden>
  <h2>Wallet summary</h2>
  <p id="walletBalance"></p>
  <p id="walletProceeds"></p>
  <button class="button primary" id="withdrawProceeds" type="button">Withdraw proceeds</button>
</section>
{% endblock %}
