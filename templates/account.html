{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <p class="eyebrow">Wallet account</p>
  <h1>Connect your wallet</h1>
  <p id="walletStatus">Connect MetaMask to see your address and registered role.</p>
</section>
<section class="panel" id="rolePanel" hidden>
  <h2>Register a role</h2>
  <p>Your choice is permanent for this coursework version.</p>
  <div class="button-row">
    <button class="button primary" data-register-role="1" type="button">Register as Producer</button>
    <button class="button secondary" data-register-role="2" type="button">Register as Buyer</button>
  </div>
</section>
{% endblock %}
