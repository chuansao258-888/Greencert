services:
  - type: web
    name: greencert
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: DEPLOYMENT_FILE
        value: /opt/render/project/src/deployment.json
      - key: COOKIE_SECURE
        value: "true"
